# Everything third-party RbxNative ships, fetches and shows, or owes an idea
# to: the one list CREDITS.md is generated from and Settings > About shows.
# After editing it, regenerate CREDITS.md with
#   RBX_WRITE_CREDITS=1 cargo test -p rbx_studio credits
#
# Each entry: name, owner, url, license, use (what RbxNative uses it for),
# required (whether the licence or terms require the credit, as opposed to
# only welcoming it), and, for a licence text that has to travel with the
# files, notice = "<path in the repo> as <file name in licenses/>", one
# line, which .github/release/notices.sh copies into every package.

[[group]]
title = "Fonts"

