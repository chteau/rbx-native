name = "rbx-presence-relay"
main = "src/index.ts"
compatibility_date = "2025-09-01"

# One Durable Object per room, holding that room's presence in memory only.
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "RoomObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomObject"]

# Requests are not logged by the Worker itself; keep Cloudflare's own
# request logs off too, so no payload or room id is kept.
[observability]
enabled = false
