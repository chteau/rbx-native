# Posts every published release to the Discord #releases channel.
# Needs the DISCORD_RELEASES_WEBHOOK repo secret (a webhook made by the server's bot,
# so the link buttons render).
name: Discord release post

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to post again (e.g. v0.1.0)
        required: true

permissions:
  contents: read

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json name,tagName,url,body,publishedAt,isPrerelease > release.json

      - name: Post to Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_RELEASES_WEBHOOK }}
          ROLE: "1569674071556366366" # Release ping
        run: |
          jq --arg role "$ROLE" --arg repo "https://github.com/$GITHUB_REPOSITORY" '
            (.body // "" | gsub("\r"; "")) as $b
            | (if ($b | length) > 3500 then ($b[0:3500] + "\n\n…") else $b end) as $notes
            | {
                username: "RbxNative",
                content: (if .isPrerelease then null else "<@&\($role)>" end),
                allowed_mentions: { roles: (if .isPrerelease then [] else [$role] end) },
                embeds: [{
                  color: 7110619,
                  title: ((.name // .tagName) + (if .isPrerelease then " (pre-release)" else "" end)),
                  url: .url,
                  description: (if $notes == "" then "New release." else $notes end),
                  timestamp: .publishedAt,
                  footer: { text: .tagName }
                }],
                components: [{ type: 1, components: [
                  { type: 2, style: 5, label: "Download", emoji: { name: "⬇️" }, url: .url },
                  { type: 2, style: 5, label: "Changelog", emoji: { name: "📝" }, url: "\($repo)/blob/dev/CHANGELOG.md" },
                  { type: 2, style: 5, label: "Docs", emoji: { name: "📖" }, url: "https://rbxnative.chteau.bzh/docs/" }
                ]}]
              }' release.json > payload.json
          curl -fsS -H "Content-Type: application/json" -d @payload.json "$WEBHOOK?wait=true&with_components=true" -o /dev/null
