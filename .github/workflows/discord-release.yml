# Posts every published release to the Discord #releases channel.
# Needs the DISCORD_RELEASES_WEBHOOK repo secret (a webhook made by the server's bot,
# so the link buttons render).
name: Discord release post

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to post again (e.g. v0.1.0)
        required: true

permissions:
  contents: read

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/release/discord-payload.jq
          sparse-checkout-cone-mode: false

      - name: Fetch the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json name,tagName,url,body,publishedAt,isPrerelease,assets > release.json

      # The embed (changelog, per-OS download links, the install one-liners)
      # is built by discord-payload.jq, which also checks Discord's limits.
      - name: Post to Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_RELEASES_WEBHOOK }}
          ROLE: "1569674071556366366" # Release ping
          # The Flathub page, once the app is listed there.
          FLATHUB: ""
        run: |
          jq --arg role "$ROLE" --arg repo "https://github.com/$GITHUB_REPOSITORY" --arg flathub "$FLATHUB" \
            -f .github/release/discord-payload.jq release.json > payload.json
          jq '.embeds[0] | {description: (.description | length), fields: [.fields[] | .value | length]}' payload.json
          curl -fsS -H "Content-Type: application/json" -d @payload.json "$WEBHOOK?wait=true&with_components=true" -o /dev/null
