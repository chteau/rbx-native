name: Test build

# Hand-dispatched alpha builds for testers on Windows, macOS and Linux. Not
# the release pipeline: nothing is published as a GitHub Release, and only
# macOS is packaged (the signed RbxNative.app in a disk image, as releases
# ship it, see release/macos-app.sh); each OS gets one workflow artifact
# zip that expires with the run.
on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Test build (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    strategy:
      # One OS failing should not throw away the builds the others finished.
      fail-fast: false
      matrix:
        include:
          - os: windows
            runner: windows-latest # x86_64-pc-windows-msvc
            exe: rbxstudio.exe
            name: RbxNative.exe
          - os: macos
            runner: macos-latest # aarch64-apple-darwin
            exe: rbxstudio
            name: RbxNative
          - os: linux
            # Oldest runner GitHub still has, same as release.yml, so testers on
            # older distros (glibc 2.35+) can run it.
            runner: ubuntu-22.04 # x86_64-unknown-linux-gnu
            exe: rbxstudio
            name: rbxnative
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        if: matrix.os == 'linux'
        # Same set as ci.yml: rbx_studio (GPUI Kit) needs these for
        # window/input handling on X11.
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-x11-dev libx11-xcb-dev libssl-dev libfontconfig1-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # The editor is the only program a tester needs: luau-lsp, cloudflared
      # and slirp4netns are fetched by rbx_studio's build.rs and embedded,
      # Loren's runner and template are embedded by rbx_loren's, and the
      # icons, themes, fonts and API dump are compiled in. On Windows,
      # WinDivert (Play's network simulator, LGPLv3) ships unmodified next to
      # the editor with its license, as in the release zip.
      - name: cargo build --release
        run: cargo build --release -p rbx_studio --bin rbxstudio

      # The release's signed app in a disk image: a bare binary copied into
      # an installed RbxNative.app breaks the bundle's signature. Same
      # identity every build, so Keychain and Accessibility grants survive
      # an update (see macos-sign.sh).
      - name: App and disk image (macOS)
        if: matrix.os == 'macos'
        env:
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' crates/rbx_studio/Cargo.toml | head -n 1)"
          app="$RUNNER_TEMP/app/RbxNative.app"
          .github/release/macos-app.sh target/release/rbxstudio "$version" "$app"
          .github/release/macos-dmg.sh "$app" "$RUNNER_TEMP/RbxNative.dmg"

      - name: Stage the artifact
        shell: bash
        run: |
          short_sha="${GITHUB_SHA::7}"
          echo "SHORT_SHA=$short_sha" >> "$GITHUB_ENV"
          mkdir dist
          if [ "${{ matrix.os }}" = macos ]; then
            cp "$RUNNER_TEMP/RbxNative.dmg" "dist/RbxNative-$short_sha.dmg"
          else
            # Cargo's binary is rbxstudio; it ships under the release's name.
            cp "target/release/${{ matrix.exe }}" "dist/${{ matrix.name }}"
          fi
          if [ "${{ matrix.os }}" = windows ]; then
            .github/release/windivert.sh dist
          fi
          # The app bundle carries its own (macos-app.sh).
          if [ "${{ matrix.os }}" != macos ]; then
            .github/release/notices.sh dist
          fi
          {
            cat .github/test-build/README-ALPHA.txt
            echo
            echo "Build: ${{ matrix.os }}, commit $GITHUB_SHA ($GITHUB_REF_NAME)"
          } > dist/README-ALPHA.txt

      # upload-artifact zips `dist/` itself, so the download is one zip with
      # the program and the README at its root. Zip drops the Unix
      # executable bit, which is why the README says `chmod +x` on Linux; a
      # disk image keeps the app inside it whole.
      - uses: actions/upload-artifact@v4
        with:
          name: RbxNative-${{ matrix.os }}-${{ env.SHORT_SHA }}
          path: dist/
          if-no-files-found: error
