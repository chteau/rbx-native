# Publishes the website to GitHub Pages. The custom domain,
# https://rbxnative.chteau.bzh, is set in the repository settings.
name: pages
on:
  push:
    branches: [website]
  # Daily, so the contributor wall picks up new GitHub contributors.
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Contributor wall
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/contributors.py contributors.html contributors.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
