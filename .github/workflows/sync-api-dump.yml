name: Sync Roblox API Dump

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-api-dump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch latest Roblox Studio version
        id: get_version
        run: |
          VERSION=$(curl -s https://setup.rbxcdn.com/versionQTStudio)
          echo "rbx_version=$VERSION" >> $GITHUB_OUTPUT
          echo "Latest Roblox version: $VERSION"

      - name: Download latest API-Dump.json
        run: |
          VERSION="${{ steps.get_version.outputs.rbx_version }}"
          curl -fsS "https://setup.rbxcdn.com/${VERSION}-API-Dump.json" -o assets/API-Dump.json

      - name: Check for changes
        id: git_status
        run: |
          if git diff --quiet assets/API-Dump.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - uses: dtolnay/rust-toolchain@stable
        if: steps.git_status.outputs.changed == 'true'

      - uses: Swatinem/rust-cache@v2
        if: steps.git_status.outputs.changed == 'true'

      # Format-drift check: rebuild with the new dump embedded and re-parse
      # the fixtures against assets/tests/dumps, plus the crates whose tests
      # read the dump directly. A failure stops the commit below, so dev
      # never picks up a dump the parser disagrees with; the failed run is
      # the alert. Only these crates: none of them pulls in GPUI, so no
      # system packages are needed.
      - name: Check parsed output against the reference dumps
        if: steps.git_status.outputs.changed == 'true'
        run: cargo test -p rbx_parser_cli -p rbx_reflection -p rbx_lua

      - name: Commit and push update
        if: steps.git_status.outputs.changed == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(deps): update Roblox API Dump to ${{ steps.get_version.outputs.rbx_version }}"
          git push
