name: Sync Roblox API Dump

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-api-dump:
    runs-on: ubuntu-latest
    # The dump goes straight onto dev, no PR. dev's protection only lets
    # admins push past review, so the push uses API_DUMP_TOKEN, a
    # maintainer's fine-grained token for this repo with Contents: write.
    # GITHUB_TOKEN can't: it isn't an admin.
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: dev
          token: ${{ secrets.API_DUMP_TOKEN }}

      - name: Fetch latest Roblox Studio version
        id: get_version
        run: |
          # versionQTStudio stopped tracking releases (it still names
          # version-d0e8cfcd943d4ae2, whose dump lacks ~250 live classes);
          # client-version is what the Studio bootstrapper itself reads.
          VERSION=$(curl -fsS https://clientsettingscdn.roblox.com/v2/client-version/WindowsStudio64 | jq -r .clientVersionUpload)
          [[ $VERSION == version-* ]] || { echo "::error::unexpected Studio version: $VERSION"; exit 1; }
          echo "rbx_version=$VERSION" >> $GITHUB_OUTPUT
          echo "Latest Roblox version: $VERSION"

      - name: Download latest API-Dump.json
        run: |
          VERSION="${{ steps.get_version.outputs.rbx_version }}"
          curl -fsS "https://setup.rbxcdn.com/${VERSION}-API-Dump.json" -o new-dump.json
          # Releases add and retire a few classes at a time. A dump that loses
          # a large share is a stale or stripped build, not an update: keep
          # the current one and say so rather than failing the run.
          before=$(jq '.Classes | length' assets/API-Dump.json)
          after=$(jq '.Classes | length' new-dump.json)
          if (( after * 100 < before * 95 )); then
            echo "::warning::${VERSION} dump has $after classes against $before bundled; keeping the bundled dump"
            rm new-dump.json
          else
            mv new-dump.json assets/API-Dump.json
          fi

      - name: Check for changes
        id: git_status
        run: |
          if git diff --quiet assets/API-Dump.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - uses: dtolnay/rust-toolchain@stable
        if: steps.git_status.outputs.changed == 'true'

      - uses: Swatinem/rust-cache@v2
        if: steps.git_status.outputs.changed == 'true'

      # The reference renderings in assets/tests/dumps name enum items
      # through the dump, so a release that drops a property (or renames an
      # enum item) changes a line there. That's a routine release, not a
      # broken parser, so the renderings are regenerated with the dump and
      # their drift goes into the PR for review instead of failing the run
      # every night until someone notices.
      - name: Regenerate the reference dumps
        if: steps.git_status.outputs.changed == 'true'
        run: UPDATE_DUMPS=1 cargo test -p rbx_parser_cli --test real_files fixtures_render_as_their_reference_dumps

      # Anything else that disagrees with the new dump still stops the
      # commit below. Only these crates: none of them pulls in GPUI, so no
      # system packages are needed.
      - name: Test the crates that read the dump
        if: steps.git_status.outputs.changed == 'true'
        run: cargo test -p rbx_parser_cli -p rbx_reflection -p rbx_lua

      - name: Commit the update to dev
        if: steps.git_status.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.get_version.outputs.rbx_version }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(deps): update Roblox API Dump to $VERSION"
          # dev may have moved while the tests ran; the dump never conflicts.
          for try in 1 2 3; do
            git pull --rebase -q origin dev && git push origin HEAD:dev && exit 0
            sleep $((try * 10))
          done
          exit 1
