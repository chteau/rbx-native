[package]
name = "rbx_parser_cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "rbxdump"
path = "src/main.rs"

[[bin]]
name = "rbxlua"
path = "src/lua/main.rs"

[[bin]]
name = "rbxmerge"
path = "src/merge/main.rs"

[[bin]]
name = "rbxaudit"
path = "src/audit/main.rs"

[dependencies]
rbx_dom = { path = "../rbx_dom" }
rbx_binary = { path = "../rbx_binary" }
# Sniffed alongside rbx_binary: rbxdump also reads .rbxlx/.rbxmx place files.
rbx_xml = { path = "../rbx_xml" }
rbx_reflection = { path = "../rbx_reflection", features = ["embedded-dump"] }
# rbxlua only: runs a Luau script against the loaded DOM.
rbx_lua = { path = "../rbx_lua" }
# rbxlua loadtest and test: a Local Run server with bot players, and the
# session integration specs run on.
rbx_sim = { path = "../rbx_sim" }
# rbxaudit only: the whole-place script security audit it prints.
rbx_audit = { path = "../rbx_audit" }
# rbxaudit --prepublish only: asks the asset service whether ids exist, and
# reads meshes out of the local asset cache.
rbx_cloud = { path = "../rbx_cloud" }
rbx_assets = { path = "../rbx_assets" }
# rbxlua test only: Loren's `return function(t)` specs and Rojo project folders.
rbx_loren = { path = "../rbx_loren" }
# rbxmerge only: the sidecar conflict file it leaves for the editor; both
# already in Cargo.lock via other crates.
serde_json = "1"
base64 = "0.22"

[dev-dependencies]
# rbxlua's integration tests write scripts and `--out` targets to disk;
# already resolved in the lockfile via another crate's dev-dependencies.
tempfile = "3"
