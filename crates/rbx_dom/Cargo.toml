[package]
name = "rbx_dom"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# Error enum for the mutation API (DomError); already in Cargo.lock via sibling crates.
thiserror = "2"
# Fast hashing for the Ref-keyed maps (MIT/Apache-2.0).
rustc-hash = "2"

[dev-dependencies]
# Loads assets/tests/TestPlace.rbxl to test fresh-Ref uniqueness against a real file.
rbx_binary = { path = "../rbx_binary" }
# Round-trips merged DOMs through the XML formats in the merge tests.
rbx_xml = { path = "../rbx_xml" }
