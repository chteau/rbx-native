[package]
name = "rbx_lua"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
# The only mature Rust binding to Luau, Roblox's own dialect: it vendors and
# builds the upstream Luau sources itself and exposes the native `Lua::sandbox`
# used here, so no other crate can replace it. `luau` implies vendoring.
mlua = { version = "0.12", features = ["luau"] }
rbx_dom = { path = "../rbx_dom" }
rbx_reflection = { path = "../rbx_reflection" }

[dev-dependencies]
# Integration tests script a real place file and need the bundled API dump.
rbx_binary = { path = "../rbx_binary" }
rbx_reflection = { path = "../rbx_reflection", features = ["embedded-dump"] }
