[package]
name = "rbx_assets"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "tga"] }
zip = { version = "8", default-features = false, features = ["deflate"] }
thiserror = "2"
# `refs`: the asset references a place's DOM carries.
rbx_dom = { path = "../rbx_dom" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = { version = "3", features = ["gzip"] }
rbx_net = { path = "../rbx_net" }
