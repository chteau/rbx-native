[package]
name = "rbx_import"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# Reads `.gltf`/`.glb` to count triangles per mesh; its `import` feature (image
# decoding, buffer loading) is not needed to read accessor counts.
gltf = { version = "1", default-features = false, features = ["names", "utils"] }
# Reads a texture's pixel size from its header alone, so a 2048 px PNG is not
# decoded just to compare its dimensions with the Marketplace limit.
imagesize = "0.14"
# `.obj` is the one format Roblox's Assets API does not take; it is read here
# and rewritten as glTF.
tobj = "4"
# Binary FBX's polygon indices give the triangle count; the file itself is
# uploaded untouched for Roblox's importer.
fbxcel = { version = "0.9", features = ["tree", "writer"] }
serde_json = "1"
# A glTF with a separate `.bin` or texture is one upload only once those are
# inlined as data URIs, and the converted `.obj` carries its buffer the same way.
base64 = "0.22"
# Studio's importer decimates a mesh over the triangle limit instead of
# refusing it; meshoptimizer's quadric simplifier does the same here.
meshopt = "0.7"

[dev-dependencies]
