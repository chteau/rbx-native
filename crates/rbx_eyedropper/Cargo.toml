[package]
name = "rbx_eyedropper"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Picks a colour from anywhere on screen: desktop portal or X11 on Linux, a mouse hook on Windows, NSColorSampler on macOS."

[target.'cfg(target_os = "linux")'.dependencies]
# All already in the tree under GPUI's Linux backend, at these versions.
ashpd = { version = "0.13", default-features = false, features = ["async-io", "screenshot"] }
futures-lite = "2"
x11rb = { version = "0.13", features = ["cursor"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
# Already in the tree under the vendored gpui-base, at these versions.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSColor", "NSColorSampler", "NSColorSpace", "block2"] }
block2 = "0.6"
