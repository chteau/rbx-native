[package]
name = "rbx_reflection"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[features]
# The API dump is a 4 MB asset; only binaries that actually need it opt in.
embedded-dump = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
