[package]
name = "rbx_viewer"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "rbxview"
path = "src/main.rs"

# The performance harness (see scripts/bench.sh). An example rather than a bin
# so it never ships in a release build of the viewer, with `test = true` because
# cargo does not run an example's own unit tests otherwise — and the statistics
# and argument parsing behind a committed number have to be held to the same
# gate as everything else.
[[example]]
name = "bench"
path = "examples/bench/main.rs"
test = true

[dependencies]
rbx_dom = { path = "../rbx_dom" }
rbx_binary = { path = "../rbx_binary" }
# Sniffed alongside rbx_binary in load::read_place: a place file may be either
# format, and this is the one shared spot that tells them apart.
rbx_xml = { path = "../rbx_xml" }
rbx_reflection = { path = "../rbx_reflection", features = ["embedded-dump"] }
rbx_assets = { path = "../rbx_assets" }
rbx_materials = { path = "../rbx_materials" }
rbx_mesh = { path = "../rbx_mesh" }
wgpu = "30.0"
winit = "0.30"
glam = "0.33"
bytemuck = { version = "1.25", features = ["derive"] }
pollster = "1.0"
png = "0.18"
# Text shaping and glyph rasterisation for `TextLabel`/`TextButton`/`TextBox`
# (see `renderer::gui::text`). Already in `Cargo.lock` through the editor's
# GPUI, so this pins the same version rather than adding one.
cosmic-text = "0.19"
# cosmic-text's own rasteriser, reached directly to dilate a glyph outline for
# a weight its family has no face at (see `renderer::gui::text::Typesetter`);
# already in `Cargo.lock` through cosmic-text.
swash = { version = "0.2", features = ["render"] }
# Roblox describes a font family as a small JSON file (`fonts/families/*.json`,
# see `fonts::Family`); already in `Cargo.lock` through `rbx_cloud`.
serde_json = "1"
# `std::time::Instant::now` panics on wasm; this is the same type on native
# and `performance.now()` in a browser. Already in `Cargo.lock` through winit.
web-time = "1.1"

# The network: Open Cloud and Roblox's CDNs through a blocking client, which a
# browser has neither of — a wasm build asks `rbxview --serve` instead.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rbx_cloud = { path = "../rbx_cloud" }

# The browser build (see `web`); every one already in `Cargo.lock` through wgpu
# and winit.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Response", "HtmlCanvasElement", "console"] }
console_error_panic_hook = "0.1"

[dev-dependencies]
# `batch`'s own tests write throwaway place files to disk; already resolved in
# the lockfile via `rbx_parser_cli`'s dev-dependency of the same name.
tempfile = "3"
