[package]
name = "rbx_autorig"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
# Vector maths, the same version the viewer, the editor and the animation
# crate already use.
glam = "0.33"
# `.gltf`/`.glb` geometry; `utils` is what reads accessors into positions,
# normals and UVs.
gltf = { version = "1", default-features = false, features = ["names", "utils"] }
# `.obj` geometry.
tobj = "4"
# Binary FBX geometry, read through the same node tree the animation importer
# walks.
fbxcel = { version = "0.9", features = ["tree"] }
thiserror = "2"
# The `.glb` writer's JSON chunk.
serde_json = "1"
# Buffers a `.gltf` embeds as base64 data URIs.
base64 = "0.22"

[dev-dependencies]
# The `version 2.00` writer is checked against the repository's own parser.
rbx_mesh = { path = "../rbx_mesh" }
# Writes the binary FBX the reader test loads.
fbxcel = { version = "0.9", features = ["tree", "writer"] }
